[pytest]
DJANGO_SETTINGS_MODULE = DjangoSet.setting
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = orders/tests
addopts = -q

# Valores dummy para tornar setting.py importável nos testes, injetados por
# pytest-env ANTES do Django carregar. Nenhum teste faz rede ou banco.
env =
    DJANGO_SECRET_KEY=test-secret-key-not-for-production
    DEBUG=True
    SUPABASE_URL=https://dummy.supabase.co
    SUPABASE_KEY=dummy-key-for-tests
